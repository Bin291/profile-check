# Render Blueprint — deploys the Express + Resend email API (server/index.ts).
# Render dashboard: New → Blueprint → connect this repo → it reads this file.
services:
  - type: web
    name: npb-portfolio-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: RESEND_API_KEY
        sync: false # from https://resend.com/api-keys
      - key: CONTACT_TO
        sync: false # inbox that receives messages, e.g. binhnguyen290104@gmail.com
      - key: RESEND_FROM
        sync: false # e.g. "Portfolio <onboarding@resend.dev>"
      - key: ALLOWED_ORIGINS
        sync: false # your Cloudflare URL, e.g. https://www.binhh.id.vn,https://binhh.id.vn
